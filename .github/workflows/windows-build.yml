name: Windows build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build Windows installer
        run: npm run build

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: LoL-Matchup-Viewer-Windows-unsigned
          path: release/LoL-Matchup-Viewer-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
